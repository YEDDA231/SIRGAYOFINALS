<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio - Joeb Englatera</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" />

    <style>
        body {
            background: #0f172a;
            color: white;
        }

        .chat-messages {
            height: 300px;
            overflow-y: auto;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
        }

        .chat-form {
            display: flex;
            gap: 10px;
        }

        .chat-form input {
            flex: 1;
        }
    </style>
</head>

<body>

<div class="container mt-5">
    <h1 class="mb-4">Joeb Portfolio</h1>

    <!-- CHATBOT SECTION -->
    <div class="card p-4 bg-dark">
        <h3>Chatbot</h3>

        <div id="chatMessages" class="chat-messages mb-3"></div>

        <form id="chatForm" class="chat-form">
            <input id="chatInput" type="text" class="form-control" placeholder="Type your message..." required />
            <button type="submit" class="btn btn-primary">Send</button>
        </form>
    </div>
</div>

<script>
document.getElementById("chatForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const inputField = document.getElementById("chatInput");
    const message = inputField.value;

    const chatBox = document.getElementById("chatMessages");

    // Show user message
    chatBox.innerHTML += `<div><b>You:</b> ${message}</div>`;

    inputField.value = "";

    try {
        const response = await fetch("https://cloud.flowiseai.com/api/v1/prediction/06b70cbe-3e62-4cf4-8e33-9d74263c3edd", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                question: message
            })
        });

        const data = await response.json();

        // Show bot response
        chatBox.innerHTML += `<div><b>Bot:</b> ${data.text}</div>`;
    } catch (error) {
        chatBox.innerHTML += `<div style="color:red;">Error connecting to chatbot</div>`;
    }

    chatBox.scrollTop = chatBox.scrollHeight;
});
</script>

</body>
</html>
